<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>CodeGuard</title>
  <link rel="stylesheet" href="Guard.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <img class="logo" src="Logo.png" alt="CodeGuard">
      <div>
        <p class="eyebrow">CODEGUARD</p>
        <h1>開啟你的專案</h1>
        <p class="intro">檢查連線環境，再於終端機使用 Claude Code。</p>
      </div>
    </header>
    <section class="summary" aria-live="polite">
      <span class="summary-dot" aria-hidden="true"></span>
      <div>
        <p id="overall-title" class="summary-title">正在檢查</p>
        <p id="overall-detail" class="summary-detail">請稍候完成所有必要檢查。</p>
      </div>
    </section>
    <section id="environment-checks" class="checks" aria-label="環境狀態"></section>
    <label id="risk-acceptance" class="risk-acceptance" hidden>
      <input id="risk-acceptance-checkbox" type="checkbox" autocomplete="off">
      <span>
        <strong>我已知風險，繼續</strong>
        <small>只接受目前機房 IP 及風險分數；其餘檢查仍須通過。</small>
        <small id="risk-acceptance-status" class="risk-acceptance-status" aria-live="polite"></small>
      </span>
    </label>
    <details class="desktop-protection">
      <summary id="desktop-summary">CLI 與連線防護</summary>
      <section id="desktop-checks" class="checks" aria-label="CLI 與連線防護"></section>
    </details>
    <section class="project-selection" aria-label="專案">
      <div>
        <h2>專案資料夾</h2>
        <p id="project-path">尚未選擇</p>
      </div>
      <button id="project-button" class="secondary" type="button">選擇專案</button>
    </section>
    <div class="actions">
      <button id="continue-button" class="primary" type="button" disabled>在終端機開啟 Claude Code</button>
      <button id="retry-button" class="secondary" type="button" disabled>重新檢查</button>
    </div>
    <p class="notice">獨立桌面啟動器。登入與操作批准由原生 CLI 處理；CLI 仍可按其權限設定讀寫檔案及執行指令。連線防護只涵蓋此啟動路徑，不能保證帳戶安全。</p>
  </main>
  <script src="Guard.js" defer></script>
</body>
</html>
